<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D1117">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Maintix">
  <meta name="description" content="Maintix — Gestion de checklists de maintenance">
  <title>Maintix</title>

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json?v=47">

  <!-- Favicons (cache-buster pour forcer le rechargement par le navigateur) -->
  <link rel="icon" href="/favicon.ico?v=47" sizes="any">
  <link rel="icon" href="/assets/icons/favicon-16.png?v=47" sizes="16x16" type="image/png">
  <link rel="icon" href="/assets/icons/favicon-32.png?v=47" sizes="32x32" type="image/png">
  <link rel="icon" href="/assets/icons/favicon-48.png?v=47" sizes="48x48" type="image/png">

  <!-- Apple Touch Icon (180×180 — iPhone / iPad home screen) -->
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png?v=47">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">

  <!-- Fonts (Google Fonts avec fallback système si bloqué) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

  <!-- Icons — auto-hébergé (résistant aux bloqueurs de pub) -->
  <link rel="stylesheet" href="/assets/fontawesome/css/all.min.css">

  <!-- App CSS -->
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/components.css">
</head>
<body>

  <!-- ── INDUSTRIAL BACKGROUND ── -->
  <div id="mx-bg" aria-hidden="true"></div>

  <!-- ── LOADING SCREEN ── -->
  <div id="app-loading" class="app-loading">
    <div class="loading-logo">MX</div>
    <div class="loading-dots"><span></span><span></span><span></span></div>
  </div>

  <!-- ── APP SHELL ── -->
  <div id="app-shell" class="app-shell hidden">

    <!-- SIDEBAR (Desktop) -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <img src="/assets/icons/maintix-logo.png" alt="Maintix" class="sidebar-logo">
      </div>
      <nav id="sidebar-nav" class="sidebar-nav"></nav>
      <div id="sidebar-footer" class="sidebar-footer"></div>
    </aside>

    <!-- Mobile sidebar overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="MX.closeSidebar()"></div>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">

      <!-- Desktop header -->
      <header class="desk-header" id="desk-header"></header>

      <!-- Top bar (Mobile only) -->
      <header class="topbar">
        <button class="hamburger" aria-label="Ouvrir le menu" onclick="MX.toggleSidebar()">
          <i class="fas fa-bars" aria-hidden="true"></i>
        </button>
        <img src="/assets/icons/maintix-logo.png" alt="Maintix" class="topbar-logo">
        <span class="topbar-title" id="topbar-title"></span>
        <div class="topbar-actions">
          <button class="gs-trigger" aria-label="Recherche (Ctrl+K)" onclick="MX.GlobalSearch.open()">
            <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <!-- Announcement banner -->
      <div id="ann-banner" class="ann-banner hidden"></div>

      <!-- Page content -->
      <main id="main-content" class="main-content"></main>

      <!-- System status bar -->
      <div id="status-bar" class="status-bar"></div>
    </div>

    <!-- Bottom nav (Mobile) -->
    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>

  <!-- ── USER PICKER OVERLAY ── -->
  <div id="user-picker" class="login-overlay hidden">
    <div class="login-card" style="max-width:420px">
      <img src="/assets/icons/maintix-logo.png" alt="Maintix" style="width:80px;height:80px;object-fit:contain;margin-bottom:4px">
      <h1 class="login-title">Connexion</h1>
      <p class="login-sub">Sélectionnez votre profil pour accéder à vos tâches.</p>
      <div id="user-picker-list" style="width:100%;display:flex;flex-direction:column;gap:8px;margin-bottom:16px"></div>
      <button class="login-back" onclick="MX.Auth.skipPicker()">
        <i class="fas fa-eye"></i> Continuer sans connexion
      </button>
    </div>
  </div>

  <!-- ── ADMIN LOGIN OVERLAY ── -->
  <div id="login-overlay" class="login-overlay hidden">
    <div class="login-card">
      <img src="/assets/icons/maintix-logo.png" alt="Maintix" style="width:80px;height:80px;object-fit:contain;margin-bottom:4px">
      <h1 class="login-title">Administration</h1>
      <p class="login-sub">Connectez-vous avec votre compte administrateur pour accéder au panneau de configuration.</p>
      <form id="login-form" onsubmit="MX.Auth.login(event)" style="width:100%">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" class="fi" placeholder="admin@…" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" id="login-password" class="fi" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <div id="login-error" class="login-error hidden" style="margin-top:4px"></div>
        <button type="submit" class="primary-btn" id="login-btn" style="margin-top:4px">
          <i class="fas fa-sign-in-alt"></i> Se connecter
        </button>
      </form>
      <button class="login-back" onclick="MX.Auth.cancelLogin()">
        <i class="fas fa-arrow-left"></i> Retour à l'application
      </button>
    </div>
  </div>

  <!-- ── TOAST ── -->
  <div id="toast" class="toast"></div>

  <!-- ── MODAL ── -->
  <div id="modal-bg" class="modal-bg">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title" id="m-title"></div>
      <div class="modal-sub"  id="m-sub"></div>
      <div class="modal-body" id="m-body"></div>
      <div class="modal-actions" id="m-actions"></div>
    </div>
  </div>

  <!-- ── FIREBASE SDK ── -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>

  <!-- ── APP SCRIPTS ── -->
  <script src="/assets/js/firebase-config.js?v=47"></script>
  <script src="/assets/js/utils/helpers.js?v=47"></script>
  <script src="/assets/js/utils/uuid.js?v=47"></script>
  <script src="/assets/js/db.js?v=47"></script>
  <script src="/assets/js/auth.js?v=47"></script>
  <!-- Widgets -->
  <script src="/assets/js/widgets/task-row.js?v=47"></script>
  <script src="/assets/js/widgets/user-badge.js?v=47"></script>
  <script src="/assets/js/widgets/progress-widget.js?v=47"></script>
  <script src="/assets/js/widgets/slot-card.js?v=47"></script>
  <script src="/assets/js/widgets/global-search.js?v=47"></script>
  <!-- Pages -->
  <script src="/assets/js/pages/home.js?v=47"></script>
  <script src="/assets/js/pages/checklist.js?v=47"></script>
  <script src="/assets/js/pages/messages.js?v=47"></script>
  <script src="/assets/js/pages/orders.js?v=47"></script>
  <script src="/assets/js/pages/admin.js?v=47"></script>
  <script src="/assets/js/pages/resp-planning.js?v=47"></script>
  <script src="/assets/js/pages/rewards.js?v=47"></script>
  <script src="/assets/js/pages/minigames.js?v=47"></script>
  <script src="/assets/js/app.js?v=47"></script>

</body>
</html>
