  <!-- Early theme init — must run before any CSS is applied to prevent FOUC -->
  <script>(function(){try{var p=JSON.parse(localStorage.getItem('mx_user_prefs')||'{}');var h=document.documentElement;if(p.theme==='light'){h.setAttribute('data-theme','light');h.style.colorScheme='light';}if(p.text_size&&p.text_size!=='normal')h.setAttribute('data-size',p.text_size);if(p.compact)h.setAttribute('data-compact','true');if(p.accent&&p.accent!=='cyan'){var D={blue:'#60A5FA',violet:'#A78BFA',pink:'#F472B6',orange:'#FB923C',green:'#4ADE80'};var L={blue:'#2563EB',violet:'#7C3AED',pink:'#DB2777',orange:'#EA580C',green:'#16A34A'};var M=p.theme==='light'?L:D;var hex=M[p.accent];if(hex){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);h.style.setProperty('--cyan',hex);h.style.setProperty('--cyan-dim','rgba('+r+','+g+','+b+','+(p.theme==='light'?0.09:0.10)+')');h.style.setProperty('--cyan-border','rgba('+r+','+g+','+b+',0.28)');}}}catch(e){}})()</script>

    <div class="spl-particles" id="spl-particles" aria-hidden="true"></div>
    <div class="spl-content">
      <img src="/assets/icons/maintix-logo.png" alt="Maintix" class="spl-logo">
      <div class="spl-name">MAINTIX</div>
      <div class="spl-bar-wrap" aria-hidden="true"><div class="spl-bar"><div class="spl-bar-inner"></div></div></div>
      <div class="spl-ver" id="spl-ver">Maintix v1.1.08</div>
    </div>

  <!-- Particle init — runs immediately, GPU-only, no jank -->
  <script>(function(){
    var p=document.getElementById('spl-particles');
    if(!p)return;
    for(var i=0;i<56;i++){
      var d=document.createElement('div');
      d.className='spl-dot';
      var sz=(Math.random()*2.4+0.5).toFixed(1);
      d.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+sz+'px;height:'+sz+'px;--a1:'+((Math.random()*0.12+0.03).toFixed(2))+';--a2:'+((Math.random()*0.60+0.20).toFixed(2))+';--dur:'+((Math.random()*3.2+1.6).toFixed(1))+'s;--del:'+((Math.random()*4.0).toFixed(1))+'s';
      p.appendChild(d);
    }
  })();</script>
